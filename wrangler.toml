name = "divine-grace-api"
account_id = "2566c6e2a3e93ce72e192ed984bde7f0"
main = "src/index.js"
compatibility_date = "2025-02-04"

# KV Namespace bindings for data storage
kv_namespaces = [
	{ binding = "LSTS_KV", id = "f1da1bada70a4819a357269787f11c7a", preview_id = "0fd54322e53345b6b204f8dd8956a3ab" },
	{ binding = "PRAYERS_KV", id = "0bb090356717423ba8e76c2231c1ce7a", preview_id = "aed71c9a5bb4432bab4b3e9891e50d0c" },
	{ binding = "SUMMIT_KV", id = "9e92d0ae77054edfb4c557ad8bcfcd04", preview_id = "f29929524dab4d86b30fa909000758e3" }
]

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "divine-grace-storage"

# Durable Objects (optional - for advanced use cases)
# durable_objects = {
#   bindings = [
#     { name = "COUNTER", class_name = "Counter" }
#   ]
# }

# Environment variables
# Default environment variables
[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://divinegraceunn.com.ng"

[env.development]
vars = { ENVIRONMENT = "development" }

# Triggers (optional - for scheduled tasks)
# [[triggers.crons]]
# cron = "0 0 * * *"

# Observability
[observability]
enabled = false
